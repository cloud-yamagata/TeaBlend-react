version: 1
reportId: Factory2LotStockList
title: 第2工場ロット在庫一覧

filters:
  - key: item_no
    label: 商品NO
    type: text
    default: ""
    placeholder: 商品NOを入力
  - key: item_name
    label: 商品名
    type: itemZoom
    default: ""
    placeholder: 商品名を入力
    zoomCodeKey: item_no

grid:
  rowId:
    mode: concat
    fields:
      - lot_no
      - product_no
      - product_date
      - process_type

  options:
    pageSize: 25
    rowHeight: 32
    headerHeight: 40

  columns:
    - field: lot_no
      header: ロットNO
      minWidth: 90
      flex: 0.8
      align: center
    - field: process_type
      header: 工程
      minWidth: 110
      flex: 1
      align: left
    - field: product_no
      header: 製造NO
      minWidth: 110
      flex: 1
      align: center
    - field: product_date
      header: 製造日
      minWidth: 120
      flex: 1
      align: left
      format: ymd
    - field: lot_nam
      header: ロット名
      minWidth: 200
      flex: 1.6
      align: left
    - field: item_name
      header: 通称名
      minWidth: 150
      flex: 1.2
      align: left
    - field: organic_class
      header: 有機区分
      minWidth: 90
      flex: 0.8
      align: center
    - field: make_year
      header: 年度
      minWidth: 80
      flex: 0.7
      align: center
    - field: count
      header: 回数
      minWidth: 70
      flex: 0.6
      align: center
    - field: factory2_product_quantity
      header: 第2工場生産
      minWidth: 120
      flex: 1
      align: right
    - field: factory2_input_quantity
      header: 第2工場投入
      minWidth: 120
      flex: 1
      align: right
    - field: factory2_sales_quantity
      header: 第2工場出荷
      minWidth: 120
      flex: 1
      align: right
    - field: factory2_adjust_quantity
      header: 第2工場調整
      minWidth: 120
      flex: 1
      align: right
    - field: factory3_receive_quantity
      header: 第3工場受入
      minWidth: 120
      flex: 1
      align: right
    - field: factory2_stock
      header: 第2工場在庫
      minWidth: 130
      flex: 1
      align: right

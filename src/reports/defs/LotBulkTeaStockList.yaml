version: 1
reportId: LotBulkTeaStockList
title: ロット別仕上茶在庫一覧
filterLayout: blendLot
fetchOnce: true
actionBar: true

filters:
  - key: make_year
    label: 年度
    type: makeYear
  - key: quantity_filter
    label: 移動量
    type: checkGroup
    options:
      - key: factory2_product
        label: 第2工場生産量
        field: factory2_product_quantity
      - key: factory3_product
        label: 第3工場生産量
        field: factory3_product_quantity
      - key: factory2_stock
        label: 第2工場在庫量
        field: factory2_stock
      - key: factory3_stock
        label: 第3工場在庫量
        field: factory3_stock
  - key: item_no
    label: 商品NO
    type: text
    default: ""
    placeholder: 商品NOを入力
  - key: item_name
    label: 商品名
    type: itemZoom
    default: ""
    placeholder: 商品名を入力
    zoomCodeKey: item_no
    zoomButtonLabel: 仕上茶

grid:
  rowId:
    mode: concat
    fields:
      - item_no
      - product_no
      - product_date
      - store_no

  options:
    pageSize: 25
    rowHeight: 32
    headerHeight: 40

  columns:
    - field: item_no
      header: 商品No
      minWidth: 90
      flex: 0.8
      align: center
    - field: product_name
      header: 商品名
      minWidth: 200
      flex: 1.6
      align: left
    - field: product_date
      header: 製造日
      minWidth: 120
      flex: 1.0
      align: left
      format: ymd
    - field: product_no
      header: 製造No
      minWidth: 110
      flex: 1.0
      align: center
    - field: make_year
      header: 年度
      minWidth: 80
      flex: 0.7
      align: center
    - field: count
      header: 回数
      minWidth: 80
      flex: 0.7
      align: center
    - field: process_name
      header: 工程
      minWidth: 120
      flex: 1.0
      align: left
    - field: store_no
      header: 工場
      minWidth: 70
      flex: 0.6
      align: center
    - field: factory2_product_quantity
      header: 第2工場生産
      minWidth: 70
      flex: 1.0
      align: right
    - field: factory3_product_quantity
      header: 第3工場生産
      minWidth: 70
      flex: 1.0
      align: right
    - field: factory3_receive_quantity
      header: 第3工場受入
      minWidth: 70
      flex: 1.0
      align: right
    - field: factory3_input_quantity
      header: 第3工場投入
      minWidth: 70
      flex: 1.0
      align: right
    - field: factory3_ship_quantity
      header: 第3工場出荷
      minWidth: 70
      flex: 1.0
      align: right
    - field: factory3_adjust_quantity
      header: 第3工場調整
      minWidth: 70
      flex: 1.0
      align: right
    - field: factory2_stock
      header: 第2工場在庫
      minWidth: 70
      flex: 1.0
      align: right
    - field: factory3_stock
      header: 第3工場在庫
      minWidth: 70
      flex: 1.0
      align: right


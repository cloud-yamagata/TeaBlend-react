version: 1
reportId: BulkTeaYearOnYearProduction
title: 月別仕上茶前年対比生産量

filters:
  - key: item_no
    label: 商品NO
    type: text
    default: ""
    placeholder: 商品NOを入力
  - key: item_name
    label: 商品名
    type: itemZoom
    default: ""
